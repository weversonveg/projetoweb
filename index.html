<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Itens | Corporativo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1e3a8a;
            --success: #059669;
            --success-light: #d1fae5;
            --danger: #dc2626;
            --danger-light: #fee2e2;
            --info: #2563eb;
            --info-light: #dbeafe;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-500: #6b7280;
            --gray-700: #374151;
            --gray-900: #111827;
            --white: #ffffff;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--gray-900);
        }

        .container {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow-xl);
            padding: 40px;
            width: 100%;
            max-width: 800px;
            border: 1px solid var(--gray-200);
        }

        .hidden { display: none !important; }

        .auth-container { max-width: 450px; text-align: center; }
        .auth-icon {
            width: 64px; height: 64px;
            background: #dbeafe;
            color: var(--primary);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
        }
        .auth-icon svg { width: 32px; height: 32px; }
        .auth-container h2 { font-size: 1.5rem; margin-bottom: 8px; color: var(--gray-900); }
        .auth-container p { font-size: 0.875rem; color: var(--gray-500); margin-bottom: 24px; }
        
        .form-group { text-align: left; margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 600; color: var(--gray-700); margin-bottom: 6px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px 16px; border: 1px solid var(--gray-300);
            border-radius: 8px; font-size: 0.9375rem; outline: none; transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,64,175,0.1); }
        
        /* Ajuste para o input de arquivo não ficar estranho no focus */
        .form-group input[type="file"] { padding: 10px; background: var(--gray-50); cursor: pointer; }
        .form-group input[type="file"]:focus { box-shadow: none; border-color: var(--gray-300); }

        .btn-full { width: 100%; justify-content: center; margin-top: 8px; }

        .btn-clear-token {
            background: transparent;
            border: none;
            color: var(--danger);
            font-size: 0.75rem;
            cursor: pointer;
            margin-top: 12px;
            text-decoration: underline;
            padding: 4px 8px;
        }
        .btn-clear-token:hover { color: var(--danger-light); }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--gray-200);
        }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .header-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            color: white; box-shadow: var(--shadow-md);
        }
        .header-icon svg { width: 24px; height: 24px; }
        .header-text h1 { font-size: 1.5rem; font-weight: 700; color: var(--gray-900); letter-spacing: -0.025em; }
        .header-text p { font-size: 0.875rem; color: var(--gray-500); margin-top: 2px; }

        .btn-disconnect {
            background: transparent; border: 1px solid var(--gray-300); color: var(--gray-500);
            padding: 8px 12px; border-radius: 8px; cursor: pointer; display: flex;
            align-items: center; gap: 6px; font-size: 0.875rem; font-weight: 500; transition: all 0.2s;
        }
        .btn-disconnect:hover { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }
        .btn-disconnect svg { width: 16px; height: 16px; }

        .sync-status {
            font-size: 0.75rem; color: var(--gray-500); display: flex; align-items: center; gap: 6px;
            background: var(--gray-50); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--gray-200);
        }
        .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray-300); }
        .sync-dot.active { background: var(--success); box-shadow: 0 0 0 2px var(--success-light); }
        .sync-dot.loading { background: #d97706; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .input-group { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 28px; 
            align-items: stretch;
        }
        #itemInput {
            flex: 1; 
            padding: 12px 16px; 
            border: 1px solid var(--gray-300);
            border-radius: 8px; 
            font-size: 0.9375rem; 
            outline: none; 
            transition: all 0.2s;
            resize: vertical;
            min-height: 48px;
            max-height: 200px;
        }
        #itemInput:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,64,175,0.1); }

        .btn-add {
            padding: 12px 20px; background: var(--primary); color: white; border: none;
            border-radius: 8px; font-size: 0.9375rem; cursor: pointer; transition: all 0.2s;
            font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
            align-self: flex-end;
            height: fit-content;
        }
        .btn-add svg { width: 18px; height: 18px; }
        .btn-add:hover { background: var(--primary-hover); box-shadow: var(--shadow-md); transform: translateY(-1px); }
        .btn-add:disabled { background: var(--gray-300); cursor: not-allowed; transform: none; }

        .table-wrapper { background: var(--white); border: 1px solid var(--gray-200); border-radius: 10px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: var(--gray-50); border-bottom: 1px solid var(--gray-200); }
        th {
            padding: 14px 20px; text-align: left; font-size: 0.75rem; font-weight: 600;
            color: var(--gray-700); text-transform: uppercase; letter-spacing: 0.05em;
        }
        th:last-child { text-align: right; }
        tbody tr { transition: background 0.15s; border-bottom: 1px solid var(--gray-100); }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: var(--gray-50); }
        td { padding: 16px 20px; font-size: 0.9375rem; word-break: break-word; line-height: 1.6; white-space: pre-wrap; }

        .item-link {
            color: var(--primary);
            text-decoration: underline;
            text-decoration-color: rgba(30, 64, 175, 0.3);
            text-underline-offset: 3px;
            word-break: break-all;
            transition: all 0.2s;
        }
        .item-link:hover {
            color: var(--primary-hover);
            text-decoration-color: var(--primary-hover);
            background: var(--info-light);
            padding: 1px 4px;
            border-radius: 4px;
        }

        .actions { display: flex; gap: 8px; justify-content: flex-end; }
        .btn-action {
            width: 36px; height: 36px; border: 1px solid transparent; border-radius: 8px;
            cursor: pointer; transition: all 0.2s; display: inline-flex; align-items:center;
            justify-content: center; background: transparent; position: relative;
        }
        .btn-action svg { width: 18px; height: 18px; transition: transform 0.2s; }
        .btn-action:hover svg { transform: scale(1.1); }
        
        .btn-edit { color: var(--info); }
        .btn-edit:hover { background: var(--info-light); border-color: var(--info); }
        
        .btn-copy { color: var(--success); }
        .btn-copy:hover { background: var(--success-light); border-color: var(--success); }
        
        .btn-delete { color: var(--danger); }
        .btn-delete:hover { background: var(--danger-light); border-color: var(--danger); }

        .btn-action::after {
            content: attr(data-tooltip); position: absolute; bottom: calc(100% + 6px); left: 50%;
            transform: translateX(-50%); background: var(--gray-900); color: white;
            font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; white-space: nowrap;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .btn-action:hover::after { opacity: 1; }

        .empty-message { text-align: center; color: var(--gray-500); padding: 48px 20px; }
        .empty-icon { width: 48px; height: 48px; margin: 0 auto 12px; color: var(--gray-300); }

        .toast {
            position: fixed; bottom: 30px; right: 30px; background: var(--gray-900); color: white;
            padding: 12px 20px; border-radius: 8px; display: flex; align-items: center; gap: 10px;
            opacity: 0; transform: translateY(20px); transition: all 0.3s; pointer-events: none;
            z-index: 1000; box-shadow: var(--shadow-md); font-size: 0.875rem; font-weight: 500;
        }
        .toast svg { width: 18px; height: 18px; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.warning { background: #d97706; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 24, 39, 0.5); backdrop-filter: blur(3px);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
            padding: 20px;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: var(--white); border-radius: 12px; padding: 32px; 
            width: 100%; max-width: 750px;
            box-shadow: var(--shadow-xl); transform: scale(0.95); transition: transform 0.2s ease;
        }
        .modal-overlay.show .modal-content { transform: scale(1); }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 1.25rem; font-weight: 600; color: var(--gray-900); }
        .modal-close { 
            background: transparent; border: none; cursor: pointer; color: var(--gray-500); 
            padding: 6px; display: flex; align-items: center; justify-content: center; border-radius: 6px;
        }
        .modal-close:hover { background: var(--gray-100); color: var(--gray-900); }
        
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 28px; }
        .btn-cancel { background: var(--gray-100); color: var(--gray-700); border: 1px solid var(--gray-200); }
        .btn-cancel:hover { background: var(--gray-200); box-shadow: none; transform: none; }
        .btn-save { background: var(--primary); color: white; border: none; }
        .btn-save:hover { background: var(--primary-hover); box-shadow: var(--shadow-md); transform: translateY(-1px); }

        @media (max-width: 600px) {
            .container { padding: 24px; }
            .header { flex-direction: column; align-items: flex-start; gap: 16px; }
            .input-group { flex-direction: column; }
            .btn-add { align-self: stretch; justify-content: center; }
            .modal-content { padding: 24px; max-width: 100%; }
            .header-right-mobile { flex-direction: column; width: 100%; gap: 12px; }
            .header-right-mobile button { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="container auth-container" id="authPanel">
        <div class="auth-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h2>Conectar ao Sistema</h2>
        <p>Digite seu Token do GitHub para liberar o acesso aos dados salvos na nuvem.</p>
        
        <div class="form-group">
            <label for="tokenInput">GitHub Token (Inicia com ghp_...)</label>
            <input type="password" id="tokenInput" placeholder="Cole seu token seguro aqui">
        </div>
        
        <button class="btn-add btn-full" id="btnConnect" onclick="conectar()">
            Conectar
        </button>
        
        <button class="btn-clear-token" onclick="limparTokenSalvo()">
            Limpar token salvo e recarregar
        </button>
    </div>

    <div class="container hidden" id="appPanel">
        <div class="header">
            <div class="header-left">
                <div class="header-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </div>
                <div class="header-text">
                    <h1>Gerenciador de Itens</h1>
                    <p>Sincronizado na nuvem • Acesso de qualquer dispositivo</p>
                </div>
            </div>
            <div class="header-right-mobile" style="display: flex; gap: 12px; align-items: center;">
                <!-- NOVO BOTÃO DE UPLOAD -->
                <button class="btn-add" style="background: var(--success); height: 36px; padding: 8px 16px; font-size: 0.875rem;" onclick="abrirModalUpload()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    Upload
                </button>
                <div class="sync-status">
                    <div class="sync-dot" id="syncDot"></div>
                    <span id="syncText">Aguardando...</span>
                </div>
                <button class="btn-disconnect" onclick="desconectar()" title="Sair deste computador">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Sair
                </button>
            </div>
        </div>

        <div class="input-group">
            <textarea id="itemInput" placeholder="Digite ou cole um item aqui... (Ctrl+Enter para adicionar)" rows="2"></textarea>
            <button class="btn-add" id="btnAdd" onclick="adicionarItem()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Adicionar
            </button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Conteúdo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo"></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL DE EDIÇÃO -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Item</h3>
                <button class="modal-close" onclick="fecharModalEdicao()" title="Fechar (ESC)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="form-group">
                <label for="editInput">Conteúdo do Item</label>
                <textarea id="editInput" rows="8" placeholder="Digite ou cole o novo conteúdo aqui..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-add btn-cancel" onclick="fecharModalEdicao()">Cancelar</button>
                <button class="btn-add btn-save" onclick="salvarEdicao()">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <!-- NOVO MODAL DE UPLOAD -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📤 Enviar Arquivo para Repositório</h3>
                <button class="modal-close" onclick="fecharModalUpload()" title="Fechar (ESC)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="form-group">
                <label for="repoInput">Repositório (ex: usuario/nome-do-repo)</label>
                <input type="text" id="repoInput" placeholder="seu-usuario/meu-repositorio">
            </div>
            <div class="form-group">
                <label for="pastaInput">Pasta de Destino (deixe vazio para raiz)</label>
                <input type="text" id="pastaInput" placeholder="ex: uploads/documentos">
            </div>
            <div class="form-group">
                <label for="fileInput">Selecionar Arquivo (Máximo 1MB)</label>
                <input type="file" id="fileInput">
            </div>
            <div class="modal-actions">
                <button class="btn-add btn-cancel" onclick="fecharModalUpload()">Cancelar</button>
                <button class="btn-add btn-save" id="btnUpload" onclick="fazerUploadArquivo()">Enviar para o GitHub</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const GIST_ID = 'fb3ab256d2471b3d95a94b7d2771bb5f'; 
        const FILENAME = 'dados.json';
        
        let GITHUB_TOKEN = localStorage.getItem('gist_token_salvo');
        let itens = [];
        let isSaving = false;
        let editIndex = -1;

        const authPanel = document.getElementById('authPanel');
        const appPanel = document.getElementById('appPanel');
        const input = document.getElementById('itemInput');
        const tabelaCorpo = document.getElementById('tabelaCorpo');
        const btnAdd = document.getElementById('btnAdd');
        const syncDot = document.getElementById('syncDot');
        const syncText = document.getElementById('syncText');
        const editModal = document.getElementById('editModal');
        const editInput = document.getElementById('editInput');
        const uploadModal = document.getElementById('uploadModal');

        console.log('🔍 Token encontrado no localStorage:', GITHUB_TOKEN ? 'Sim' : 'Não');

        document.addEventListener('DOMContentLoaded', () => {
            if (GITHUB_TOKEN) {
                console.log('🚀 Tentando carregar dados automaticamente...');
                mostrarApp();
                carregarDados();
            } else {
                console.log('🔐 Mostrando tela de login');
                mostrarAuth();
            }
            
            input.addEventListener('input', autoResizeTextarea);
            input.addEventListener('paste', () => setTimeout(autoResizeTextarea, 0));
        });

        function autoResizeTextarea() {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 200) + 'px';
        }

        input.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !isSaving) {
                adicionarItem();
            }
        });

        function limparTokenSalvo() {
            if (confirm('Isso vai limpar o token salvo e recarregar a página. Deseja continuar?')) {
                localStorage.removeItem('gist_token_salvo');
                location.reload();
            }
        }

        function conectar() {
            const token = document.getElementById('tokenInput').value.trim();
            const btnConnect = document.getElementById('btnConnect');

            if (!token) return mostrarToast('Digite o Token para conectar.', 'warning');
            if (!token.startsWith('ghp_') && !token.startsWith('github_pat_')) return mostrarToast('Token inválido. Deve começar com ghp_ ou github_pat_', 'error');

            btnConnect.disabled = true;
            btnConnect.textContent = 'Conectando...';
            GITHUB_TOKEN = token;

            carregarDados().then(sucesso => {
                if (sucesso) {
                    localStorage.setItem('gist_token_salvo', token);
                    mostrarApp();
                    mostrarToast('Conectado com sucesso!', 'success');
                } else {
                    btnConnect.disabled = false;
                    btnConnect.textContent = 'Conectar';
                }
            });
        }

        function desconectar(silencioso = false) {
            if (silencioso || confirm('Deseja sair? Será necessário o token novamente na próxima vez.')) {
                localStorage.removeItem('gist_token_salvo');
                location.reload();
            }
        }

        function mostrarAuth() {
            authPanel.classList.remove('hidden');
            appPanel.classList.add('hidden');
        }

        function mostrarApp() {
            authPanel.classList.add('hidden');
            appPanel.classList.remove('hidden');
            input.focus();
        }

        function atualizarStatus(status) {
            syncDot.className = 'sync-dot';
            if (status === 'loading') {
                syncDot.classList.add('loading');
                syncText.textContent = 'Processando...';
                btnAdd.disabled = true;
                isSaving = true;
            } else if (status === 'success') {
                syncDot.classList.add('active');
                syncText.textContent = 'Sincronizado';
                btnAdd.disabled = false;
                isSaving = false;
            } else if (status === 'error') {
                syncText.textContent = 'Erro';
                btnAdd.disabled = false;
                isSaving = false;
            }
        }

        async function carregarDados() {
            atualizarStatus('loading');
            try {
                const response = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                
                if (!response.ok) {
                     if (response.status === 401) desconectar(true);
                     throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                const conteudo = data.files[FILENAME]?.content || '{"itens": []}';
                
                try {
                    itens = JSON.parse(conteudo).itens || [];
                } catch (parseError) { itens = []; }
                
                renderizarTabela();
                atualizarStatus('success');
                return true;
            } catch (error) {
                atualizarStatus('error');
                mostrarToast('Falha na conexão com o GitHub.', 'error');
                return false;
            }
        }

        async function salvarDados() {
            atualizarStatus('loading');
            try {
                const response = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files: { [FILENAME]: { content: JSON.stringify({ itens: itens }, null, 2) } } })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                atualizarStatus('success');
            } catch (error) {
                atualizarStatus('error');
                mostrarToast('Erro ao salvar os dados.', 'error');
            }
        }

        function renderizarTabela() {
            tabelaCorpo.innerHTML = '';
            if (itens.length === 0) {
                tabelaCorpo.innerHTML = `<tr><td colspan="2" class="empty-message">Nenhum item adicionado ainda</td></tr>`;
                return;
            }

            itens.forEach((item, index) => {
                const linha = document.createElement('tr');
                linha.innerHTML = `
                    <td>${formatarLinks(item)}</td>
                    <td>
                        <div class="actions">
                            <button class="btn-action btn-edit" data-tooltip="Editar" onclick="abrirModalEdicao(${index})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
                            <button class="btn-action btn-copy" data-tooltip="Copiar" onclick="copiarConteudo(${index})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
                            <button class="btn-action btn-delete" data-tooltip="Excluir" onclick="excluirLinha(${index})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                        </div>
                    </td>`;
                tabelaCorpo.appendChild(linha);
            });
        }

        async function adicionarItem() {
            const valor = input.value.trim();
            if (!valor) return mostrarToast('Digite algo.', 'warning');
            itens.unshift(valor);
            input.value = '';
            input.style.height = 'auto';
            renderizarTabela();
            await salvarDados();
            mostrarToast('Item adicionado no topo!', 'success');
        }

        async function excluirLinha(index) {
            if(!confirm('Tem certeza que deseja excluir este item?')) return;
            itens.splice(index, 1);
            renderizarTabela();
            await salvarDados();
            mostrarToast('Item excluído.', 'success');
        }

        async function copiarConteudo(index) {
            try { await navigator.clipboard.writeText(itens[index]); mostrarToast('Copiado!', 'success'); } 
            catch { mostrarToast('Erro ao copiar.', 'error'); }
        }

        function abrirModalEdicao(index) {
            editIndex = index; editInput.value = itens[index]; editModal.classList.add('show');
            setTimeout(() => editInput.focus(), 100);
        }

        function fecharModalEdicao() { editModal.classList.remove('show'); editIndex = -1; }

        async function salvarEdicao() {
            const novoValor = editInput.value.trim();
            if (!novoValor) return mostrarToast('O conteúdo não pode estar vazio.', 'warning');
            if (editIndex !== -1) {
                itens[editIndex] = novoValor; renderizarTabela(); await salvarDados();
                mostrarToast('Item atualizado com sucesso!', 'success'); fecharModalEdicao();
            }
        }

        // ==========================================
        // LÓGICA DO NOVO UPLOAD DE ARQUIVOS
        // ==========================================
        function abrirModalUpload() {
            // Carrega o último repositório e pasta usados para facilitar
            document.getElementById('repoInput').value = localStorage.getItem('github_upload_repo') || '';
            document.getElementById('pastaInput').value = localStorage.getItem('github_upload_pasta') || '';
            uploadModal.classList.add('show');
        }

        function fecharModalUpload() {
            uploadModal.classList.remove('show');
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.toString().replace(/^data:(.*,;)?base64,/, ''));
                reader.onerror = error => reject(error);
            });
        }

        async function fazerUploadArquivo() {
            const repo = document.getElementById('repoInput').value.trim();
            let pasta = document.getElementById('pastaInput').value.trim();
            const fileInput = document.getElementById('fileInput');
            const btnUpload = document.getElementById('btnUpload');

            if (!repo || !fileInput.files.length) return mostrarToast('Preencha o repositório e selecione um arquivo.', 'warning');

            // Formata a pasta
            if (pasta && !pasta.endsWith('/')) pasta += '/';
            if (pasta.startsWith('/')) pasta = pasta.substring(1);

            const file = fileInput.files[0];
            const filePath = `${pasta}${file.name}`;

            btnUpload.disabled = true;
            btnUpload.textContent = 'Enviando...';
            atualizarStatus('loading');

            try {
                const base64Content = await fileToBase64(file);
                
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `🥔 Botato upload: ${file.name}`,
                        content: base64Content
                    })
                });

                if (response.status === 422) {
                    mostrarToast('Arquivo já existe nesta pasta! Mude o nome ou a pasta.', 'error');
                    atualizarStatus('error');
                } else if (response.status === 404) {
                    mostrarToast('Repositório não encontrado ou Token sem permissão "repo".', 'error');
                    atualizarStatus('error');
                } else if (!response.ok) {
                    const err = await response.json();
                    mostrarToast('Erro: ' + (err.message || response.status), 'error');
                    atualizarStatus('error');
                } else {
                    mostrarToast(`Arquivo "${file.name}" enviado com sucesso!`, 'success');
                    atualizarStatus('success');
                    
                    // Salva as preferências no navegador
                    localStorage.setItem('github_upload_repo', repo);
                    localStorage.setItem('github_upload_pasta', document.getElementById('pastaInput').value.trim());
                    
                    fecharModalUpload();
                    fileInput.value = ''; // Limpa o input de arquivo
                }
            } catch (error) {
                console.error(error);
                mostrarToast('Erro de conexão ao enviar o arquivo.', 'error');
                atualizarStatus('error');
            } finally {
                btnUpload.disabled = false;
                btnUpload.textContent = 'Enviar para o GitHub';
            }
        }

        // Eventos Globais
        [editModal, uploadModal].forEach(modal => {
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (editModal.classList.contains('show')) fecharModalEdicao();
                if (uploadModal.classList.contains('show')) fecharModalUpload();
            }
        });

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatarLinks(texto) {
            let textoSeguro = escapeHTML(texto);
            const urlRegex = /(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/gi;
            return textoSeguro.replace(urlRegex, (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer" class="item-link">${url}</a>`);
        }

        function mostrarToast(msg, tipo) {
            const toast = document.getElementById('toast');
            toast.className = 'toast show ' + tipo;
            let icon = '';
            if (tipo === 'success') icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>';
            else if (tipo === 'error') icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';
            else icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';

            toast.innerHTML = icon + `<span>${escapeHTML(msg)}</span>`;
            clearTimeout(window._t);
            window._t = setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
